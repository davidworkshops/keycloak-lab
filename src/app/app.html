<header class="site-header">
  <a class="brand" routerLink="/public">Angular + Keycloak Lab</a>

  <nav aria-label="Navegacion principal">
    <a routerLink="/public" routerLinkActive="active">Publica</a>
    <a routerLink="/profile" routerLinkActive="active">Perfil</a>
    <a routerLink="/admin" routerLinkActive="active">Admin</a>
  </nav>

  @if (auth.authenticated) {
    <button type="button" class="secondary" (click)="logout()">Logout</button>
  } @else {
    <button type="button" (click)="login()">Login</button>
  }
</header>

<main class="page-container">
  <router-outlet />
</main>
